# id: empreende, tech, games, verde ou criativa. A ordem na tela é fixa (a do Figma), definida em Eixos.astro.
- id: empreende
  nome: 'Sampa Empreende'
  texto: 'Apoio a empreendedores, orientação e facilitação de crédito.'
- id: tech
  nome: 'Sampa Tech'
  texto: 'Tecnologias digitais, inovação, IA e aceleração de startups.'
- id: games
  nome: 'Sampa Games'
  texto: 'Desenvolvimento de jogos, educação digital e aceleração de estúdios.'
  botao: 'Em breve'
- id: verde
  nome: 'Sampa Verde'
  texto: 'Economia circular, inovação verde e locais de agricultura.'
  botao: 'Em breve'
- id: criativa
  nome: 'Sampa Criativa'
  texto: 'Economia criativa, audiovisual, design de moda e cadeia têxtil.'
  botao: 'Em breve'